# 真果鉴 v2（Wails 壳）Windows 构建：纯 go build 管线（不依赖 wails CLI，
# 本机 v2.17 CLI 编 v2.10 库工程有 x/tools 兼容坑），discovery 通道走
# -tags v2overlay + -overlay 注入（对齐 v1 sidecar 构建的 overlay 机制）。
name: build-v2

on:
  workflow_dispatch:
  push:
    tags: ["v2.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend
        working-directory: client-v2/frontend
        run: |
          $inst = $false
          foreach ($reg in @("https://registry.npmjs.org", "https://registry.npmmirror.com")) {
            npm ci --registry=$reg --fetch-retries=3 --fetch-timeout=120000
            if ($LASTEXITCODE -eq 0) { $inst = $true; break }
            Write-Host "::notice::npm ci failed against $reg, trying next"
            Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          }
          if (-not $inst) { exit 1 }
          npm run build

      - name: Windows resources (icon/manifest/version)
        working-directory: client-v2/scripts/genres
        run: |
          $ver = "${env:GITHUB_REF_NAME}" -replace "^v", ""
          if (-not $ver) { $ver = "2.0.0" }
          go run . -icon ../../build/windows/icon.ico -out ../../zhenguojian-res.syso -version $ver

      - name: Overlay + build (v2overlay)
        working-directory: client-v2
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          mkdir -p "$env:RUNNER_TEMP/ov"
          python scripts/make-overlay.py "$env:RUNNER_TEMP/ov/overlay.json"
          go vet -tags "v2overlay production" -overlay "$env:RUNNER_TEMP/ov/overlay.json" ./...
          $LASTEXITCODE -eq 0 -or (throw "vet failed")
          go build -tags "v2overlay production" -overlay "$env:RUNNER_TEMP/ov/overlay.json" -trimpath -ldflags "-s -w -H=windowsgui" -o build/bin/client-v2.exe .
          if (-not (Test-Path build/bin/client-v2.exe)) { throw "client-v2.exe 未产出" }

      - name: Build info
        working-directory: client-v2
        run: |
          if (Test-Path build\bin\client-v2.exe) {
            Write-Host "exe ok: $((Get-Item build\bin\client-v2.exe).Length) bytes"
          } else {
            Write-Host "::error::build step claimed success but client-v2.exe missing"
            exit 1
          }
          $sha = git rev-parse HEAD
          $iso = (git log -1 --format=%cI).Trim()
          $sha = $sha.Trim()
          $iso = $iso.Trim()
          @{ revision = $sha; commitTime = $iso; modified = $false } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 build/bin/build-info.json

      - name: Download ffmpeg
        run: |
          # 与 v1 build.yml 同源配方：gyan.dev 主源 + BtbN/gh-proxy 兜底（GitHub CDN 事故日可用）
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://gh-proxy.com/https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-08-12-35/ffmpeg-N-128691-gcc583787bb-win64-gpl.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-08-12-35/ffmpeg-N-128691-gcc583787bb-win64-gpl.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 2; $i++) {
              curl.exe -fSL --retry 2 -o ffmpeg.zip $u 2>$null
              if ($LASTEXITCODE -ne 0) { Write-Warning "ffmpeg attempt failed: $u"; continue }
              try { Expand-Archive -Force ffmpeg.zip fftmp; $ok = $true; break }
              catch { Write-Warning "extract failed: $($_.Exception.Message)"; Remove-Item ffmpeg.zip -ErrorAction SilentlyContinue }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "ffmpeg download failed from all sources" }

      - name: Download mpv
        run: |
          $ErrorActionPreference = "Stop"
          $rel = Invoke-RestMethod -Headers @{ "User-Agent" = "ci" } https://api.github.com/repos/mpv-player/mpv/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-v*x86_64*full*.zip" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "mpv-v*x86_64*.zip" -and $_.name -notlike "*pdb*" } | Select-Object -First 1 }
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "mpv-x86_64-*.7z" } | Select-Object -First 1 }
          if (-not $asset) { throw "no usable mpv windows asset" }
          Write-Host ("mpv asset: " + $asset.name)
          New-Item -ItemType Directory -Force mpvtmp | Out-Null
          $mpvOk = $false
          $srcs = @($asset.browser_download_url, ("https://gh-proxy.com/" + $asset.browser_download_url))
          for ($i = 1; $i -le 20; $i++) {
            $u = $srcs[($i - 1) % 2]
            curl.exe -fsSL --retry 2 -o mpv.pkg $u 2>$null
            if ($LASTEXITCODE -eq 0 -and (Get-Item mpv.pkg -ErrorAction SilentlyContinue).Length -gt 1MB) { $mpvOk = $true; break }
            Write-Warning ("mpv attempt $i failed: $u")
            Start-Sleep 60
          }
          if (-not $mpvOk) { throw "mpv download failed from all sources" }
          if ($asset.name -like "*.zip") {
            Expand-Archive -Force mpv.pkg mpvtmp
          } else {
            & "C:\Program Files\7-Zip\7z.exe" x -ompvtmp -y mpv.pkg | Out-Null
          }

      - name: Assemble portable zip
        run: |
          # 布局对齐 v1 查找链：exe 同级 runtime\mpv\mpv.exe、runtime\ffmpeg\{ffmpeg,ffprobe}.exe
          $stage = "dist-v2\真果鉴-v2"
          Remove-Item -Recurse -Force dist-v2 -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage\runtime\mpv", "$stage\runtime\ffmpeg" | Out-Null
          Copy-Item client-v2\build\bin\client-v2.exe "$stage\真果鉴-v2.exe"
          Copy-Item client-v2\build\bin\build-info.json "$stage\build-info.json"
          $bin = (Get-ChildItem fftmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          Copy-Item "$bin\ffmpeg.exe", "$bin\ffprobe.exe" "$stage\runtime\ffmpeg\"
          $mpvbin = (Get-ChildItem mpvtmp -Recurse -Filter mpv.exe | Select-Object -First 1).FullName
          Copy-Item $mpvbin "$stage\runtime\mpv\mpv.exe"
          Compress-Archive -Path "$stage" -DestinationPath zhenGuoJian-v2-windows-x64.zip -Force
          Write-Host ("zip size: " + (Get-Item zhenGuoJian-v2-windows-x64.zip).Length)

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'push'
        with:
          name: v2-windows-x64
          path: |
            client-v2/build/bin/client-v2.exe
            client-v2/build/bin/build-info.json
            zhenGuoJian-v2-windows-x64.zip

      - name: Release notes
        run: |
          $sha = "${env:GITHUB_SHA}".Substring(0,12)
          @"
          ## 本 Release 资产说明

          | 文件 | 用途 |
          |---|---|
          | ``zhenGuoJian-v2-windows-x64.zip`` | **推荐下载**。v2 完整便携包：解压后运行 ``真果鉴-v2\真果鉴-v2.exe``，已内置 mpv/ffmpeg，开箱即用 |
          | ``client-v2.exe`` | v2 裸壳（约 20MB，不含 mpv/ffmpeg）。仅当你自行准备 runtime\ 目录时才用这个 |
          | ``build-info.json`` | 构建指纹（revision/commitTime）。手动替换 exe 时放同级目录，设置页「打包提交」才会显示哈希 |
          | ``Source code (zip)`` | GitHub 自动生成的源码快照，普通用户忽略 |

          构建提交：``$sha``（版本内查看：设置 > 关于 > 打包提交）
          "@ | Out-File -Encoding utf8 client-v2/build/bin/RELEASE-NOTES.md
        shell: pwsh
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v2.')
        uses: softprops/action-gh-release@v2
        with:
          body_path: client-v2/build/bin/RELEASE-NOTES.md
          files: |
            client-v2/build/bin/client-v2.exe
            client-v2/build/bin/build-info.json
            zhenGuoJian-v2-windows-x64.zip
