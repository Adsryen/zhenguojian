# electron-win-package —— 打 Electron 版 Windows 安装包 + 自检 + 传 artifact（P5b）。
#
# 为什么单独一个 workflow、为什么 workflow_dispatch 触发：
#   - 用户指令（不打 alpha tag）：「自己打包好、测试好，传到 GitHub 上
#     （artifacts 可下载）即可」。所以这是**按需**产出一个可下载包，不在
#     每次 push 上烧 windows runner（那是 electron-win-selftest 的职责）。
#   - Windows 包本机（Linux）只能构、不能真跑；真跑 + 像素确认交用户实机。
#     CI 这里负责：① 构 NSIS ② 跑**打包态**自检（isPackaged=true，用 bundle
#     里的 mpv/sidecar，证明打包布局可用）③ 传 artifact。
#
# 产物（actions/upload-artifact）：
#   - zhenguojian-v2-electron-win-x64-<sha>.exe   （NSIS 安装包，用户双击装）
#   - zhenguojian-v2-electron-win-unpacked-<sha>.zip（免安装版，解压直接跑）
#   - zhenGuoJian-v2-app-<sha>.zip                 （热更新三件套 app.asar/sidecar.exe/
#                                                    frontend/dist；上 release 时按契约名
#                                                    zhenGuoJian-v2-app.zip 传，updater
#                                                    解包覆盖 resources\ 用）
#   - build-info-<sha>.txt                        （版本/commit/时间，用户贴回来对身份）
name: electron-win-package

on:
  workflow_dispatch:

jobs:
  package-win:
    name: Windows · 打包 + 自检 + artifact
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: "local"
    steps:
      # ⚠ 禁 fetch-tags（build-v2 第六十二轮教训）。本 workflow 只需源码。
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Capture build info
        id: info
        shell: pwsh
        run: |
          $sha = git rev-parse --short HEAD
          $pkgVer = (Get-Content client-v2/electron/package.json -Raw | ConvertFrom-Json).version
          # ── 版本号统一源（依赖分离打包改造）───────────────────────────
          # 基号取 package.json，alpha 号 = 本 workflow 运行号 GITHUB_RUN_NUMBER；
          # 基号若已含预发布后缀（手改成 2.0.1-alpha.3 之类）则尊重、不再叠加。
          # 算好的值经 GITHUB_ENV 贯穿全 job：electron-builder 的 -c version、
          # sidecar 的 -ldflags、build-info.txt 三处同源，不会各说各话——历史上
          # NSIS 恒 2.0.0 而 updater 按 semver 比对 alpha tag，版本语义从一开始
          # 就是错的（2.0.0「正式版」> 任何 2.0.0-alpha.N）。
          # ⚠ alpha.N 只是产物身份号（每条 workflow 各自计数，非全局发布序）；
          #   正式发 release 时 tag 必须对上本次产物的号再喂 gen_latest_json_electron.ps1
          #   （它按 Go 侧同款 semver 形态校验 tag）。
          if ($pkgVer -match '^\d+\.\d+\.\d+$') { $ver = "$pkgVer-alpha.$env:GITHUB_RUN_NUMBER" } else { $ver = $pkgVer }
          "ZGJ_BUILD_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
          "version=$ver" | Out-File -Append build-info.txt
          "commit=$sha" | Out-File -Append build-info.txt
          "built=$([datetime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ssZ'))" | Out-File -Append build-info.txt
          "platform=windows-x64 (Electron)" | Out-File -Append build-info.txt
          "sidecar=main.buildVersion 已按上述 version 经 -ldflags 注入，updater 消费链已通（EmbeddedVersion→GetBuildInfo→latest 对账）" | Out-File -Append build-info.txt
          "note=Electron 壳测试包：视频窗=Electron 自管 BaseWindow（弃 WS_CHILD 塞 WebView2）；含 DPI 物理像素→DIP 换算修复与 ZGJ_DISABLE_GPU 诊断开关" | Out-File -Append build-info.txt
          "用法：装完 zgj-v2.exe 进播放页看画面；仍黑→set ZGJ_DISABLE_GPU=1 重启判定合成层蒙版；都黑→发 logs\mpv.log 定 vo 根因" | Out-File -Append build-info.txt
          "SHA=$sha" | Out-File -FilePath "$env:GITHUB_OUTPUT" -Append
          "version=$ver" | Out-File -FilePath "$env:GITHUB_OUTPUT" -Append

      # ── 前端 dist ──────────────────────────────────────────────────────
      - name: Frontend (build dist)
        working-directory: client-v2/frontend
        shell: pwsh
        run: |
          $regs = @("https://registry.npmmirror.com", "https://registry.npmjs.org")
          $ok = $false
          foreach ($reg in $regs) {
            npm ci --registry=$reg --fetch-retries=3 --fetch-timeout=120000
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "::notice::npm ci failed against $reg, trying next"
          }
          if (-not $ok) { throw "npm ci failed against all registries" }
          npm run build

      # ── sidecar.exe ────────────────────────────────────────────────────
      - name: Build sidecar.exe
        working-directory: client-v2
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        shell: pwsh
        run: |
          mkdir -p "$env:RUNNER_TEMP/ov"
          python scripts/make-overlay.py "$env:RUNNER_TEMP/ov/overlay.json"
          go vet -tags "zgj_sidecar v2overlay" -overlay "$env:RUNNER_TEMP/ov/overlay.json" .
          $LASTEXITCODE -eq 0 -or (throw "sidecar vet failed")
          # 版本注入（与 Build NSIS installer 的 -c version 同批，ZGJ_BUILD_VERSION
          # 由 Capture build info 步统一算出）。Wails 时代 build-v2.yml 有
          # -X main.buildVersion，Electron 迁移丢了，现在补回。已生效的消费点：
          # appLogStartup（sidecar_main.go:198 启动自证行）、GetBuildInfo 绑定
          # （bindings_settings.go:58，「关于」页/诊断贴回带版本）。
          # 历史断链说明（2026-11-18 已修）：这条 ldflags 注入曾被 Electron 迁移
          #   整体丢失，且即使注入也吃不到 updater.Current——链路=
          #   bindings_update.go:36 → LocalVersionFromExecutable() → current.go
          #   LoadLocalVersion ①EmbeddedVersion 只在 Wails 入口 main.go:29 赋值、
          #   sidecar 入口没转发 ②兜底的 exe 同级 build-info.json 在 resources\
          #   布局下不存在。两路皆空 → Dev=true → service.go「任何发布版都算更新」
          #   永远弹横幅。现 sidecar_main.go main() 已补 EmbeddedVersion=buildVersion
          #   转发（实测 GetBuildInfo 回显），本条 ldflags 即 Current 的唯一来源。
          go build -tags "zgj_sidecar v2overlay" -overlay "$env:RUNNER_TEMP/ov/overlay.json" -ldflags "-X main.buildVersion=$env:ZGJ_BUILD_VERSION" -o build/bin/sidecar.exe .
          if (-not (Test-Path build/bin/sidecar.exe)) { throw "sidecar.exe not produced" }

      # ── Electron + electron-builder ────────────────────────────────────
      # electron-builder 已进 package.json devDependencies，npm install 一并装。
      - name: Install Electron + builder
        working-directory: client-v2/electron
        env:
          ELECTRON_MIRROR: "https://npmmirror.com/mirrors/electron/"
          ELECTRON_CUSTOM_DIR: "v{{ version }}"
        shell: pwsh
        run: |
          npm install --fetch-retries=3 --fetch-timeout=180000
          if ($LASTEXITCODE -ne 0) { throw "electron/electron-builder install failed" }
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) { throw "electron binary missing" }
          if (-not (Test-Path "node_modules/.bin/electron-builder")) { throw "electron-builder missing" }

      # ── mpv（同 build-v2 / selftest 配方）───────────────────────────────
      - name: Download mpv
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $hdrs = @{ "User-Agent" = "zhenguojian-ci" }
          if ($env:GITHUB_TOKEN) { $hdrs["Authorization"] = "Bearer $env:GITHUB_TOKEN" }
          $rel = $null
          for ($try = 1; $try -le 3; $try++) {
            try { $rel = Invoke-RestMethod -Headers $hdrs https://api.github.com/repos/mpv-player/mpv/releases/latest; break }
            catch { Write-Warning "mpv releases/latest 第 $try 次失败：$($_.Exception.Message)"; Start-Sleep -Seconds (5 * $try) }
          }
          if (-not $rel) { throw "取 mpv 最新版本信息失败（3 次重试）；若 403/rate limit 说明 GITHUB_TOKEN 没生效" }
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-v*x86_64*full*.zip" } | Select-Object -First 1
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "mpv-v*x86_64*.zip" -and $_.name -notlike "*pdb*" } | Select-Object -First 1 }
          if (-not $asset) { $asset = $rel.assets | Where-Object { $_.name -like "mpv-x86_64-*.7z" } | Select-Object -First 1 }
          if (-not $asset) { throw "no usable mpv windows asset" }
          Write-Host ("mpv asset: " + $asset.name)
          New-Item -ItemType Directory -Force mpvtmp | Out-Null
          $mpvOk = $false
          $srcs = @($asset.browser_download_url, ("https://gh-proxy.com/" + $asset.browser_download_url))
          for ($i = 1; $i -le 20; $i++) {
            $u = $srcs[($i - 1) % 2]
            curl.exe -fsSL --retry 2 -o mpv.pkg $u 2>$null
            if ($LASTEXITCODE -eq 0 -and (Get-Item mpv.pkg -ErrorAction SilentlyContinue).Length -gt 1MB) { $mpvOk = $true; break }
            Write-Warning ("mpv attempt $i failed: $u"); Start-Sleep 60
          }
          if (-not $mpvOk) { throw "mpv download failed from all sources" }
          if ($asset.name -like "*.zip") { Expand-Archive -Force mpv.pkg mpvtmp }
          else { & "C:\Program Files\7-Zip\7z.exe" x -ompvtmp -y mpv.pkg | Out-Null }

      # ── ffmpeg（同配方）────────────────────────────────────────────────
      - name: Download ffmpeg
        shell: pwsh
        run: |
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://gh-proxy.com/https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-08-12-35/ffmpeg-N-128691-gcc583787bb-win64-gpl.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-08-12-35/ffmpeg-N-128691-gcc583787bb-win64-gpl.zip"
          )
          $ok = $false
          foreach ($u in $urls) {
            for ($i = 1; $i -le 2; $i++) {
              curl.exe -fSL --retry 2 -o ffmpeg.zip $u 2>$null
              if ($LASTEXITCODE -ne 0) { Write-Warning "ffmpeg attempt failed: $u"; continue }
              try { Expand-Archive -Force ffmpeg.zip fftmp; $ok = $true; break }
              catch { Write-Warning "extract failed: $($_.Exception.Message)"; Remove-Item ffmpeg.zip -ErrorAction SilentlyContinue }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "ffmpeg download failed from all sources" }

      # ── 填 staging/runtime（electron-builder extraResources 的来源）────
      # 打包态 main.js 的 runtimeToolExe() 从 resources/runtime/{mpv,ffmpeg}
      # 找 mpv/ffmpeg/ffprobe 并注入 sidecar env。这里把下载的 .exe 按那个
      # 布局摆进 staging/runtime，electron-builder 会原样拷进 resources/。
      - name: Stage runtime resources
        working-directory: client-v2/electron
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $mpv = Get-ChildItem -Recurse -Filter mpv.exe (Join-Path $ws "mpvtmp") | Select-Object -First 1
          if (-not $mpv) { throw ("mpv.exe not found under " + (Join-Path $ws "mpvtmp")) }
          $ffdir = Get-ChildItem -Recurse -Filter ffmpeg.exe (Join-Path $ws "fftmp") | Select-Object -First 1
          if (-not $ffdir) { throw ("ffmpeg.exe not found under " + (Join-Path $ws "fftmp")) }
          $ffexe = $ffdir.FullName
          $ffprobe = Join-Path (Split-Path $ffexe) "ffprobe.exe"
          New-Item -ItemType Directory -Force "staging/runtime/mpv" | Out-Null
          New-Item -ItemType Directory -Force "staging/runtime/ffmpeg" | Out-Null
          Copy-Item $mpv.FullName "staging/runtime/mpv/mpv.exe" -Force
          Copy-Item $ffexe "staging/runtime/ffmpeg/ffmpeg.exe" -Force
          if (Test-Path $ffprobe) { Copy-Item $ffprobe "staging/runtime/ffmpeg/ffprobe.exe" -Force }
          else { Write-Warning "ffprobe.exe not found（合并流程会缺 ffprobe，播放不受影响）" }
          "runtime 资源：mpv.exe + ffmpeg.exe" | Out-File -Encoding utf8 "staging/README-RESOURCE"
          Get-ChildItem -Recurse staging/runtime | ForEach-Object { Write-Host ("  " + $_.FullName + " (" + $_.Length + ")") }

      # ── 打 NSIS 安装包 ─────────────────────────────────────────────────
      - name: Build NSIS installer
        working-directory: client-v2/electron
        shell: pwsh
        run: |
          # -c.version 用 ZGJ_BUILD_VERSION（Capture build info 步统一算，基号来自
          # package.json）。electron-builder.yml 里「alpha 号走 CI 的 -c version
          # 覆盖」的注释此前只是承诺、从未落地（且该写法本身走不通，见下）：
          # NSIS 恒 2.0.0，而 updater 按
          # semver 比对 alpha tag，2.0.0「正式版」比任何 2.0.0-alpha.N 都新，
          # 版本语义从一开始就是错的。
          # ⚠ 覆盖方式必须用 `-c.extraMetadata.version=`（dot-notation）：
          #   ① `-c version=x` 空格形会被 yargs 当 configPath 字符串当场报错；
          #   ② 看似更直接的 `-c.version=`（root version）会被 26.18.0 的
          #     schema 拒绝「configuration has an unknown property 'version'」
          #     ——2026-11-18 本机 --linux dir 实测抓红，Windows 同版本必同样红。
          #   extraMetadata 合并进 package.json 元数据，version 语义与
          #   artifactName 的 ${version} 宏都吃合并后的值，其余 yml 配置原样。
          # ⚠ artifactName 含 ${version}，改名后 NSIS 名变 …win-x64-2.0.0-alpha.N.exe；
          #   下方与 Rename/Smoke 步的判据都是 *win-x64*.exe 中段匹配，不受影响
          #   （run9 教训：判据别用 -x64.exe 这种后缀形，会假失败）。
          if (-not $env:ZGJ_BUILD_VERSION) { throw "ZGJ_BUILD_VERSION missing (Capture build info 步没跑?)" }
          npx electron-builder --win nsis --publish never "-c.extraMetadata.version=$env:ZGJ_BUILD_VERSION"
          if ($LASTEXITCODE -ne 0) { throw "electron-builder --win nsis failed" }
          Get-ChildItem out/*.exe, out/*.zip -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host ("  artifact: " + $_.Name + " (" + [math]::Round($_.Length/1MB,1) + " MB)")
          }
          # artifactName=zhenguojian-v2-win-x64-2.0.0-alpha.N.exe（arch 在**中段**，
          # 判据匹配 *win-x64*.exe，不是 *-x64.exe（后者要求名字以 -x64.exe 结尾；
          # 本地 pwsh 复现对现名 count=0 → 假失败）。
          if (-not (Get-ChildItem out/*.exe | Where-Object { $_.Name -like "*win-x64*.exe" })) { throw "NSIS installer not produced" }

      # ── 打包态自检（isPackaged=true，用 bundle 里的 mpv/sidecar）────────
      # 证明「打包布局可用」：app.isPackaged=true 走 resourcesPath 解析
      # sidecar/frontend/runtime。mpv_wid=架构判据；像素判据 Windows 透明 skip。
      #
      # 真根因（run 44171840052 实锤，纠正上一轮的误诊）：打包 exe 的 PE
      # subsystem=2（GUI），pwsh 的 `&` 调用符**不等待 GUI 子系统进程**——
      # 立即返回，$LASTEXITCODE 还是上一条（ffmpeg）的 0，脚本 ~2s 后就查
      # selftest.json，而自检要跑 30s+，于是「缺失(exit 0)」。开发态 npx
      # electron 绿是因为 node 父进程会等；Linux 本机绿是因为 bash 会等。
      # 修法：Start-Process -PassThru + WaitForExit(300s) 显式等待，句柄
      # 直接给文件（GUI 子系统的 stdout 也能落进 st.out）。结果仍以
      # main.js 写盘的 selftest.json 为准、stdout 行为兜底。
      - name: Run packaged selftest
        working-directory: client-v2/electron
        env:
          ZHENGUO_DATA: ${{ github.workspace }}\zgj-win-packdata
          ZGJ_SELFTEST_OUT: ${{ github.workspace }}\zgj-electron-selftest
        shell: pwsh
        run: |
          # 不设 ZHENGUO_MPV/SIDECAR：打包态从 bundle resources 取（这才是要测的）。
          $app = "out/win-unpacked/zgj-v2.exe"
          if (-not (Test-Path $app)) { throw "win-unpacked/zgj-v2.exe missing" }
          # 测试视频
          $dataDir = Join-Path $env:ZHENGUO_DATA "downloads"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $vid = Join-Path $dataDir "p3-selftest.mp4"
          # 用 bundle 里的 ffmpeg 生成（顺带验 runtime/ffmpeg 就位）
          $bffmpeg = Join-Path (Get-Item .).FullName "staging/runtime/ffmpeg/ffmpeg.exe"
          & $bffmpeg -y -f lavfi -i "testsrc=duration=30:size=1280x720:rate=25" -f lavfi -i "sine=frequency=440:duration=30" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac "$vid" 2>$null
          if (-not (Test-Path $vid)) { throw "test video generation failed" }
          # 跑打包态自检：GUI 子系统必须显式等待（`&` 对 GUI 不等）。
          $appFull = (Resolve-Path $app).Path
          $outAbs = Join-Path $PWD "st.out"
          $errAbs = Join-Path $PWD "st.err"
          $p = Start-Process -FilePath $appFull -ArgumentList '--selftest' -NoNewWindow -PassThru `
               -RedirectStandardOutput $outAbs -RedirectStandardError $errAbs
          if (-not $p.WaitForExit(600000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "packaged selftest 600s 未退出（app 卡死）"
          }
          $rc = $p.ExitCode
          Write-Host "----- stderr (tail 40) -----"
          Get-Content st.err -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
          # 结果判读：以 selftest.json 为准（文件写入，不依赖 GUI exe 的流重定向），
          # stdout 的 SELFTEST_JSON 行做兜底（开发态/句柄正常时两路一致）。
          $obj = $null
          $jsonFile = Join-Path $env:ZGJ_SELFTEST_OUT "selftest.json"
          if (Test-Path $jsonFile) {
            $obj = Get-Content $jsonFile -Raw | ConvertFrom-Json
            Write-Host "（结果取自 selftest.json）"
          } else {
            $jsonLine = Get-Content st.out -ErrorAction SilentlyContinue | Where-Object { $_ -like "SELFTEST_JSON *" } | Select-Object -Last 1
            if ($jsonLine) { $obj = ($jsonLine -replace "^SELFTEST_JSON ", "") | ConvertFrom-Json }
          }
          if (-not $obj) {
            # 两路都没有=app 没走到 runSelfTest 结尾。把 sidecar 的 app.log
            # 原样倒出来定案（sidecar DataDir=ZHENGUO_DATA，app.<pid>.log 在根）。
            Write-Host "----- sidecar app.log（若存在）-----"
            Get-ChildItem $env:ZHENGUO_DATA -Filter "app.*.log" -ErrorAction SilentlyContinue | ForEach-Object {
              Write-Host ("== " + $_.Name + " ==")
              Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
            }
            throw "selftest.json 与 SELFTEST_JSON 都缺失（exit $rc）——打包自检没跑到结尾"
          }
          Write-Host "----- packaged checks -----"
          $obj.checks | ForEach-Object {
            $tag = if ($_.skip) { "SKIP" } elseif ($_.ok) { "PASS" } else { "FAIL" }
            Write-Host ("  [" + $tag + "] " + $_.name + "  " + $_.detail)
          }
          if ($rc -ne 0) { throw "packaged selftest exit $rc" }
          if (-not $obj.ok) { throw "packaged selftest ok=false（见上）" }
          Write-Host "packaged selftest: ok=true"

      # ── Build app.zip（热更新三件套，依赖与主程序分离打包的核心产物）───
      # updater 的「应用包更新」路径下载 zhenGuoJian-v2-app.zip
      # （internal/updater/releases.go:57 DefaultAppZipAsset），解包后
      # robocopy /E 直对安装目录 resources\ 覆盖。故 zip 根必须是
      # resources 层级：app.asar / sidecar.exe / frontend/dist/**，
      # 不得带 win-unpacked 前缀、不得把 dist 拍平——相对路径错了覆盖
      # 位置就错，且不会有人报错（zip 本身「看着是好的」）。
      # 为何弃 Compress-Archive / tar.exe（防复活注释）：
      #   - Compress-Archive 的 Windows 侧条目分隔符行为本机（Linux pwsh
      #     7.4.6）无法复现（实测出的是正斜杠），Go zip reader 按 ZIP 规范
      #     要求正斜杠，赌不得；
      #   - runner 的 tar.exe 是 bsdtar、本机是 GNU tar（无 -a -cf zip 能力），
      #     「本机先跑一遍」这条路不成立；
      #   - ZipFile + 显式条目名 + 反斜杠归一化：.NET 代码路径两平台一致，
      #     本机跑通一次 = Windows 行为可推断，且末尾结构自检兜底（错就红，
      #     不静默坏包——run9 双 spawn 教训同款纪律）。
      # frontend/ 整目录递归收录（当前 staging 下只有 dist/，若将来多出
      # 别的东西也一并带上，契约本来就是 frontend 这棵树）。
      - name: Build app.zip
        working-directory: client-v2/electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $res = (Resolve-Path "out/win-unpacked/resources").Path
          foreach ($t in @("app.asar", "sidecar.exe", "frontend\dist")) {
            if (-not (Test-Path (Join-Path $res $t))) { throw "app.zip 源缺失: resources\$t" }
          }
          $zip = Join-Path $PWD "out/zhenGuoJian-v2-app.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          $za = [System.IO.Compression.ZipFile]::Open($zip, [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            foreach ($f in @("app.asar", "sidecar.exe")) {
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($za, (Join-Path $res $f), $f) | Out-Null
            }
            foreach ($item in (Get-ChildItem -Recurse -File (Join-Path $res "frontend"))) {
              $rel = $item.FullName.Substring($res.Length + 1).Replace("\", "/")
              [System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile($za, $item.FullName, $rel) | Out-Null
            }
          } finally { $za.Dispose() }
          # ── 结构自检：读回条目名，断言三件齐全 + 路径形态合法 ──
          $zr = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = @($zr.Entries | ForEach-Object { $_.FullName }) } finally { $zr.Dispose() }
          if ($names -notcontains "app.asar") { throw "app.zip 缺 app.asar" }
          if ($names -notcontains "sidecar.exe") { throw "app.zip 缺 sidecar.exe" }
          $dist = @($names | Where-Object { $_ -like "frontend/dist/*" })
          if ($dist.Count -eq 0) { throw "app.zip 缺 frontend/dist/**（条目名被拍平或带了前缀?）" }
          if ($names -notcontains "frontend/dist/index.html") { throw "app.zip 的 frontend/dist 里没有 index.html（前端构建没进 staging?）" }
          $bad = @($names | Where-Object { $_ -like "*\*" -or $_ -like "*win-unpacked*" -or $_.StartsWith("/") })
          if ($bad.Count -gt 0) { throw ("app.zip 条目路径不合规（反斜杠/win-unpacked 前缀/绝对路径）: " + (($bad | Select-Object -First 5) -join " | ")) }
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host ("app.zip ready: " + (Split-Path $zip -Leaf) + " (" + $mb + " MB, " + $names.Count + " 条目, frontend/dist/** 计 " + $dist.Count + ")")

      # ── 传 artifact ────────────────────────────────────────────────────
      - name: Rename + upload artifact
        shell: pwsh
        run: |
          $sha = $env:GITHUB_SHA_SHORT
          if (-not $sha) { $sha = git rev-parse --short HEAD }
          $nsis = Get-ChildItem client-v2/electron/out/*.exe | Where-Object { $_.Name -like "*win-x64*.exe" } | Select-Object -First 1
          if (-not $nsis) { throw "no NSIS installer to upload" }
          Copy-Item $nsis.FullName "zhenguojian-v2-electron-win-x64-$sha.exe"
          # win-unpacked 免安装版打 zip
          Compress-Archive -Path "client-v2/electron/out/win-unpacked" -DestinationPath "zhenguojian-v2-electron-win-unpacked-$sha.zip" -Force
          # app.zip 进 artifact 带 sha 后缀（辨每次构建）；上 release 时改按契约名
          # zhenGuoJian-v2-app.zip 上传（gen_latest_json_electron.ps1 写的
          # assets.appZip.name 用的就是契约名）。
          $appzip = "client-v2/electron/out/zhenGuoJian-v2-app.zip"
          if (-not (Test-Path $appzip)) { throw "app.zip 缺失（Build app.zip 步没跑?）" }
          Copy-Item $appzip "zhenGuoJian-v2-app-$sha.zip"
          Copy-Item build-info.txt "build-info-$sha.txt"
          Get-ChildItem "zhenguojian-v2-electron-win-x64-$sha.exe", "zhenguojian-v2-electron-win-unpacked-$sha.zip", "zhenGuoJian-v2-app-$sha.zip", "build-info-$sha.txt" | ForEach-Object { Write-Host ("upload: " + $_.Name + " (" + [math]::Round($_.Length/1MB,1) + " MB)") }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhenguojian-v2-electron-win-x64-${{ github.sha }}
          path: |
            zhenguojian-v2-electron-win-x64-*.exe
            zhenguojian-v2-electron-win-unpacked-*.zip
            zhenGuoJian-v2-app-*.zip
            build-info-*.txt
          if-no-files-found: error
          retention-days: 14

      # ── NSIS 安装链冒烟（P5：安装包本身从未验证过 安装→就位→启动→卸载）──
      # 独立成步的意义：win-unpacked 自检证「产物能跑」，本步证「用户拿
      # Setup.exe 双击安装这条路是活的」。run1-5 教训同规：NSIS 安装器、
      # 装后 app、Uninstall 全是 GUI 子系统 exe，一律 Start-Process 显式等。
      - name: NSIS installer smoke
        shell: pwsh
        env:
          ZHENGUO_DATA: ${{ github.workspace }}\zgj-nsis-data
          ZGJ_SELFTEST_OUT: ${{ github.workspace }}\zgj-nsis-selftest
        run: |
          $nsis = Get-ChildItem client-v2/electron/out/*.exe | Where-Object { $_.Name -like "*win-x64*.exe" } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS installer not produced" }
          # ① 静默安装（electron-builder NSIS /S 对 assisted oneClick:false 同样有效）
          # ⚠ NSIS 双 spawn：Setup.exe 复制自身到 temp 再起子进程继续装，父进程
          # 先退——Start-Process -Wait 等到的 exit=0 只证「外壳拉起成功」，不证
          # 500MB 解压完成。装后必须轮询等 app.exe 就位，别拿瞬时快照断言。
          $ip = Start-Process -FilePath $nsis.FullName -ArgumentList '/S' -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw ("installer exit=" + $ip.ExitCode) }
          # electron-builder NSIS perUser 安装目录**取 executableName**，不取
          # productName——run9 dump 实锤：实际目录 Programs\zgj-v2，卸载器名
          # "Uninstall zgj-v2.exe" 同样源自 executableName。候选探测防 builder
          # 版本差异，不再猜。
          $progs = Join-Path $env:LOCALAPPDATA "Programs"
          $dir = @('zgj-v2', 'zhenguojian-v2') |
            ForEach-Object { Join-Path $progs $_ } |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $dir) { $dir = Join-Path $progs 'zgj-v2' }
          $app = Join-Path $dir "zgj-v2.exe"
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $app)) { Start-Sleep -Milliseconds 1500 }
          if (-not (Test-Path $app)) {
            Write-Host "----- Programs\ 实际目录树（定案装到哪了）-----"
            Get-ChildItem $progs -Recurse -Depth 1 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  " + $_.FullName) }
            throw ("post-install zgj-v2.exe not found under " + $dir + "（180s 轮询超时，见上目录树）")
          }
          # ② bundle 布局就位（extraResources 三件套；不锁死文件名，验目录有 exe）
          foreach ($sub in @("resources\sidecar.exe", "resources\runtime\mpv", "resources\runtime\ffmpeg", "resources\frontend\dist")) {
            $p = Join-Path $dir $sub
            if (-not (Test-Path $p)) { throw ("bundle layout missing: " + $sub) }
          }
          # ③ 用装后的 bundle ffmpeg 生成测试视频（顺带证 bundle ffmpeg 可执行）
          $dataDir = Join-Path $env:ZHENGUO_DATA "downloads"
          New-Item -ItemType Directory -Force $dataDir | Out-Null
          $vid = Join-Path $dataDir "p3-selftest.mp4"
          $bffmpeg = Get-ChildItem (Join-Path $dir "resources\runtime\ffmpeg") -Filter "*.exe" | Select-Object -First 1
          & $bffmpeg.FullName -y -f lavfi -i "testsrc=duration=30:size=1280x720:rate=25" -f lavfi -i "sine=frequency=440:duration=30" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -c:a aac "$vid" 2>$null
          if (-not (Test-Path $vid)) { throw "bundle ffmpeg failed to generate test video" }
          # ④ 装后 --selftest（同 packaged 步的 Start-Process + json 模式）
          $sp = Start-Process -FilePath $app -ArgumentList '--selftest' -NoNewWindow -PassThru `
               -RedirectStandardOutput (Join-Path $PWD "nsis-st.out") -RedirectStandardError (Join-Path $PWD "nsis-st.err")
          if (-not $sp.WaitForExit(600000)) {
            Stop-Process -Id $sp.Id -Force -ErrorAction SilentlyContinue
            throw "installed selftest 600s 未退出（app 卡死）"
          }
          $jsonFile = Join-Path $env:ZGJ_SELFTEST_OUT "selftest.json"
          if (-not (Test-Path $jsonFile)) {
            Write-Host "----- nsis-st.err (tail 40) -----"
            Get-Content nsis-st.err -Tail 40 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $_" }
            throw "installed selftest.json missing（exit $($sp.ExitCode)）"
          }
          $obj = Get-Content $jsonFile -Raw | ConvertFrom-Json
          Write-Host "----- installed-state checks -----"
          $obj.checks | ForEach-Object {
            $tag = if ($_.skip) { "SKIP" } elseif ($_.ok) { "PASS" } else { "FAIL" }
            Write-Host ("  [" + $tag + "] " + $_.name + "  " + $_.detail)
          }
          if (-not $obj.ok) { throw "installed selftest ok=false（见上）" }
          # ④.5 更新链 apply 演练：run B 带 ZGJ_UPDATE_APPLY=1——selftest 进程内
          #     假镜像服务器喂 latest.json/app.zip（tag v9.9.9 真实仓库不存在，
          #     回落只会失败，红得干净），跑通 Check→Download(默认选 app.zip)→
          #     UpdateApply：bat 真 taskkill /T 进程树 + tar 解压 + robocopy 替换
          #     resources + start 新版。zip 内容=当前安装件原样副本+marker，
          #     替换后应用必须仍健康。Apply 只在 run B 全套 ok=true 时触发
          #     （main.js 守卫），bat 失败路径兜底 start 旧 exe——失败模式收敛为
          #     「marker 不出现」而非应用死亡。
          $env:ZGJ_UPDATE_APPLY = "1"
          $sp2 = Start-Process -FilePath $app -ArgumentList '--selftest' -NoNewWindow -PassThru `
               -RedirectStandardOutput (Join-Path $PWD "nsis-upB.out") -RedirectStandardError (Join-Path $PWD "nsis-upB.err")
          if (-not $sp2.WaitForExit(600000)) {
            Stop-Process -Id $sp2.Id -Force -ErrorAction SilentlyContinue
            throw "update-apply selftest(B) 600s 未退出"
          }
          Remove-Item Env:ZGJ_UPDATE_APPLY -ErrorAction SilentlyContinue
          # run B 是被 bat taskkill 掉的，ExitCode 无意义——以 json 为准
          $objB = Get-Content (Join-Path $env:ZGJ_SELFTEST_OUT "selftest.json") -Raw | ConvertFrom-Json
          Write-Host "----- run B update exercise checks -----"
          $objB.checks | Where-Object { $_.name -like "update*" } | ForEach-Object {
            $t2 = if ($_.skip) { "SKIP" } elseif ($_.ok) { "PASS" } else { "FAIL" }
            Write-Host ("  [" + $t2 + "] " + $_.name + "  " + $_.detail)
          }
          if (-not $objB.ok) { throw "run B ok=false——update 门没绿则 apply 未触发（main.js 守卫），见上 update_* 明细" }
          $marker = Join-Path (Split-Path $app) "resources\update-marker.json"
          $dl2 = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $dl2 -and -not (Test-Path $marker)) { Start-Sleep -Milliseconds 1500 }
          if (-not (Test-Path $marker)) {
            Get-ChildItem (Split-Path $app)\resources -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  res: " + $_.Name) }
            throw "update-marker.json 180s 未出现——疑似 bat 走了 :fail 路径（已兜底拉旧 exe）；查 robocopy/tar 现场"
          }
          if (-not ((Get-Content $marker -Raw | ConvertFrom-Json).exercisedAt)) { throw "marker 内容无效" }
          # ④.6 run C：bat start 起的 GUI 实例先清（无单实例锁，留着会双 sidecar），
          #     新 bundle 全套自检证明替换后 app.asar/sidecar 仍可用
          Start-Sleep -Seconds 5
          & taskkill /F /T /IM zgj-v2.exe 2>$null | Out-Null
          & taskkill /F /IM sidecar.exe 2>$null | Out-Null
          $sp3 = Start-Process -FilePath $app -ArgumentList '--selftest' -NoNewWindow -PassThru `
               -RedirectStandardOutput (Join-Path $PWD "nsis-runC.out") -RedirectStandardError (Join-Path $PWD "nsis-runC.err")
          if (-not $sp3.WaitForExit(600000)) {
            Stop-Process -Id $sp3.Id -Force -ErrorAction SilentlyContinue
            throw "run C (post-apply) 600s 未退出"
          }
          $objC = Get-Content (Join-Path $env:ZGJ_SELFTEST_OUT "selftest.json") -Raw | ConvertFrom-Json
          if (-not $objC.ok) {
            Write-Host "----- run C checks -----"
            $objC.checks | ForEach-Object { Write-Host ("  [" + $(if ($_.skip) {"SKIP"} elseif ($_.ok) {"PASS"} else {"FAIL"})) + "] " + $_.name + "  " + $_.detail) }
            throw "run C（apply 后新 bundle）ok=false，见上"
          }
          Write-Host "update apply exercise: bat 替换 ✓ marker ✓ 新 bundle 全套自检 ✓"
          # ⑤ 静默卸载（卸载器同样双 spawn：复制到 temp 起子进程 → 等消失别等退出码）
          $uni = Get-ChildItem $dir -Filter "Uninstall*.exe" | Select-Object -First 1
          if (-not $uni) { throw "uninstaller not found under $dir" }
          $up = Start-Process -FilePath $uni.FullName -ArgumentList '/S' -Wait -PassThru
          if ($up.ExitCode -ne 0) { throw ("uninstaller exit=" + $up.ExitCode) }
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and (Test-Path $app)) { Start-Sleep -Milliseconds 1500 }
          if (Test-Path $app) {
            Get-ChildItem $dir -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  left: " + $_.Name) }
            throw "app.exe survives uninstall（120s 轮询后仍在，见上残留）"
          }
          Write-Host "NSIS smoke: install → bundle → selftest → uninstall 全绿"